<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fundations Unit 4 Review Adventure! 🦉⭐</title>
  <style>
    :root {
      --bg-top: #e0f2fe;
      --bg-bottom: #fef3c7;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --green: #16a34a;
      --green-dark: #15803d;
      --purple: #7c3aed;
      --purple-dark: #6d28d9;
      --pink: #db2777;
      --text-main: #1e293b;
      --line-sky: #38bdf8;
      --line-plane: #94a3b8;
      --line-grass: #22c55e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Rounded Mplus 1c', system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
    }

    /* Top Header */
    header {
      width: 100%;
      max-width: 1020px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 5px solid var(--amber);
      border-radius: 0 0 28px 28px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .owl-mascot {
      font-size: 2.5rem;
      animation: bob 2.4s infinite ease-in-out;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      color: #1e3a8a;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.9rem;
      color: #64748b;
      font-weight: bold;
    }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-pill {
      background: #fef3c7;
      border: 3px solid var(--amber);
      border-radius: 50px;
      padding: 6px 16px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 var(--amber-dark);
    }

    .sound-btn {
      background: #eff6ff;
      border: 3px solid var(--primary);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary-dark);
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-dark);
    }

    .sound-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    /* Navigation Tabs */
    .mode-tabs {
      width: 100%;
      max-width: 1020px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px 6px;
    }

    .tab-btn {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 900;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: #1e40af;
      color: white;
      box-shadow: 0 4px 0 #1e3a8a;
    }

    .tab-badge {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.8rem;
      padding: 2px 7px;
      border-radius: 12px;
      margin-left: 4px;
    }

    /* Main Stage */
    main {
      width: 100%;
      max-width: 960px;
      padding: 10px 16px 30px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-card {
      width: 100%;
      background: var(--card-bg);
      border: 5px solid #93c5fd;
      border-radius: 32px;
      padding: 22px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 450px;
      justify-content: space-between;
      position: relative;
    }

    .progress-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 10px;
    }

    .mode-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--primary-dark);
      margin: 0;
    }

    .step-pill {
      background: #f1f5f9;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: bold;
      color: #475569;
    }

    .prompt-banner {
      font-size: clamp(1.15rem, 2.6vw, 1.55rem);
      font-weight: 900;
      color: #1e293b;
      background: #fef9c3;
      border: 3px solid #facc15;
      padding: 10px 22px;
      border-radius: 24px;
      margin: 10px 0;
      max-width: 760px;
    }

    /* Fundations Writing Grid Display (Sky line, Plane line, Grass line) */
    .fundations-lines {
      position: relative;
      background: #fffbeb;
      border: 4px solid #fbbf24;
      border-radius: 24px;
      padding: 26px 36px 34px;
      margin: 10px 0;
      min-width: 320px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }

    .fundations-lines::before {
      content: "☀️";
      position: absolute;
      left: 10px;
      top: 10px;
      font-size: 1rem;
      opacity: 0.7;
    }

    .fundations-lines::after {
      content: "🌱";
      position: absolute;
      left: 10px;
      bottom: 10px;
      font-size: 1rem;
      opacity: 0.7;
    }

    /* Word Display with Baseword Scoop & Suffix Circle */
    .word-stage {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 2px;
      position: relative;
      padding: 8px 16px 22px;
    }

    .baseword-part {
      position: relative;
      padding: 0 4px;
      color: #1e293b;
      transition: all 0.25s;
    }

    /* Drawn scoop underneath the baseword */
    .baseword-part.scooped::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -14px;
      height: 18px;
      border-bottom: 6px solid #2563eb;
      border-left: 5px solid #2563eb;
      border-right: 5px solid #2563eb;
      border-radius: 0 0 28px 28px;
      animation: drawScoop 0.35s ease-out;
    }

    @keyframes drawScoop {
      0% { transform: scaleX(0.2); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    .suffix-part {
      position: relative;
      padding: 2px 10px;
      margin-left: 2px;
      color: #1e293b;
      border: 5px solid transparent;
      border-radius: 50%;
      transition: all 0.25s;
    }

    .suffix-part.circled {
      border-color: #db2777;
      background: #fce7f3;
      color: #be185d;
      animation: popCircle 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ed-sound-tag {
      position: absolute;
      top: -28px;
      right: -10px;
      background: #16a34a;
      color: white;
      font-size: 1.1rem;
      padding: 2px 10px;
      border-radius: 14px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    }

    @keyframes popCircle {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    /* Interactive Letter Boxes for Splitting Baseword / Suffix */
    .split-letters-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    /* Buttons & Choices */
    .choices-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 12px 0;
      width: 100%;
    }

    .choice-btn {
      background: #eff6ff;
      border: 4px solid #3b82f6;
      border-radius: 22px;
      padding: 12px 24px;
      font-size: clamp(1.2rem, 2.8vw, 1.65rem);
      font-weight: 900;
      color: #1d4ed8;
      cursor: pointer;
      box-shadow: 0 6px 0 #1d4ed8;
      transition: transform 0.12s, background 0.15s;
      min-width: 110px;
    }

    .choice-btn:hover:not(:disabled) {
      background: #dbeafe;
      transform: translateY(-2px);
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1d4ed8;
    }

    .choice-btn.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
      box-shadow: 0 6px 0 #15803d;
    }

    .choice-btn.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
      box-shadow: 0 6px 0 #b91c1c;
      animation: shake 0.35s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .speak-word-btn {
      background: #fef3c7;
      border: 3px solid var(--amber);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 1.15rem;
      font-weight: 900;
      color: #b45309;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--amber-dark);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .speak-word-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--amber-dark);
    }

    .next-btn {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: 4px solid #dcfce7;
      border-radius: 50px;
      padding: 12px 34px;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #15803d;
      margin-top: 10px;
    }

    .next-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #15803d;
    }

    /* Reference Poster / Anchor Chart Cards */
    .anchor-chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 12px;
      text-align: left;
    }

    .anchor-box {
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      padding: 12px 14px;
    }

    .anchor-box h4 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .suffix-box-tag {
      border: 3px solid #be185d;
      background: #fce7f3;
      color: #be185d;
      padding: 2px 10px;
      border-radius: 8px;
      font-weight: 900;
    }

    /* Spelling Tiles */
    .spell-slots {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
      min-height: 64px;
    }

    .spell-slot {
      width: 54px;
      height: 60px;
      border-bottom: 5px solid #1e293b;
      background: #fff;
      border-radius: 12px 12px 0 0;
      font-size: 2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1d4ed8;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .letter-tile {
      width: 56px;
      height: 60px;
      background: #fef08a;
      border: 3px solid #ca8a04;
      border-radius: 14px;
      font-size: 1.9rem;
      font-weight: 900;
      color: #713f12;
      cursor: pointer;
      box-shadow: 0 5px 0 #a16207;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.2s;
    }

    .letter-tile.suffix-tile {
      width: auto;
      padding: 0 16px;
      background: #fbcfe8;
      border-color: #db2777;
      color: #9d174d;
      box-shadow: 0 5px 0 #be185d;
    }

    .letter-tile.used {
      opacity: 0.25;
      pointer-events: none;
      transform: translateY(4px);
    }

    /* Sentence Fixer */
    .sentence-words-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin: 16px 0;
    }

    .sentence-word-chip {
      background: #fffbeb;
      border: 3px solid #f59e0b;
      border-radius: 16px;
      padding: 10px 18px;
      font-size: clamp(1.3rem, 3vw, 1.85rem);
      font-weight: 900;
      color: #451a03;
      cursor: pointer;
      box-shadow: 0 4px 0 #d97706;
    }

    .sentence-word-chip.capitalized {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
      box-shadow: 0 4px 0 #15803d;
    }

    .punct-slot {
      width: 58px;
      height: 58px;
      border: 4px dashed #94a3b8;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: #15803d;
      background: #f8fafc;
    }

    .punct-slot.filled {
      border-style: solid;
      border-color: #16a34a;
      background: #dcfce7;
    }

    .feedback-msg {
      min-height: 32px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #15803d;
      margin: 6px 0;
    }

    .feedback-msg.error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <header>
    <div class="brand">
      <div class="owl-mascot" title="Echo the Owl!">🦉</div>
      <div>
        <h1>Fundations Unit 4 Adventure!</h1>
        <p>Basewords, Suffixes (-s, -es, -ing, -ed, -er, -est), Trick Words & Sentences</p>
      </div>
    </div>
    <div class="score-bar">
      <div class="star-pill">⭐ <span id="star-count">0</span> Stars</div>
      <button class="sound-btn" id="voice-toggle">🔊 Voice On</button>
    </div>
  </header>

  <nav class="mode-tabs">
    <button class="tab-btn active" data-mode="scoop">
      1️⃣ Scoop & Circle <span class="tab-badge" id="badge-scoop">0/10</span>
    </button>
    <button class="tab-btn" data-mode="edsounds">
      2️⃣ 3 Sounds of -ed <span class="tab-badge" id="badge-edsounds">0/12</span>
    </button>
    <button class="tab-btn" data-mode="trick">
      3️⃣ Trick Words <span class="tab-badge" id="badge-trick">0/6</span>
    </button>
    <button class="tab-btn" data-mode="sentences">
      4️⃣ Sentence Fixer <span class="tab-badge" id="badge-sentences">0/6</span>
    </button>
    <button class="tab-btn" data-mode="chart">
      📖 Study Chart
    </button>
  </nav>

  <main>
    <div class="game-card" id="game-stage">
      <!-- Dynamic content injected here -->
    </div>
  </main>

  <script>
    // =========================================================================
    // WORKSHEET SOURCE DATA (From Fundations Unit 4 Word List Review Sheet)
    // =========================================================================

    // Section 1: The 10 numbered Suffix review words on the left of the worksheet
    const unit4WordList = [
      { word: 'fills',     base: 'fill',   suffix: 's',   edSound: null, sentence: 'Dad fills the cup with milk.' },
      { word: 'hunted',    base: 'hunt',   suffix: 'ed',  edSound: '/id/', sentence: 'The owl hunted for a snack.' },
      { word: 'crunches',  base: 'crunch', suffix: 'es',  edSound: null, sentence: 'She crunches the crisp apple.' },
      { word: 'spilled',   base: 'spill',  suffix: 'ed',  edSound: '/d/',  sentence: 'Who spilled the water?' },
      { word: 'smallest',  base: 'small',  suffix: 'est', edSound: null, sentence: 'That is the smallest puppy!' },
      { word: 'landed',    base: 'land',   suffix: 'ed',  edSound: '/id/', sentence: 'The plane landed on the track.' },
      { word: 'socks',     base: 'sock',   suffix: 's',   edSound: null, sentence: 'Put on your warm socks.' },
      { word: 'crashing',  base: 'crash',  suffix: 'ing', edSound: null, sentence: 'Big waves are crashing.' },
      { word: 'oldest',    base: 'old',    suffix: 'est', edSound: null, sentence: 'Grandpa told the oldest story.' },
      { word: 'boxes',     base: 'box',    suffix: 'es',  edSound: null, sentence: 'We packed ten brown boxes.' }
    ];

    // Section 2: "Three sounds of ed" chart from the worksheet + the -ed words from the list
    const edSoundWords = [
      { word: 'hunted',  base: 'hunt',  sound: '/id/', hint: 'Baseword ends in t or d, so -ed adds a syllable: /id/!' },
      { word: 'spilled', base: 'spill', sound: '/d/',  hint: 'Listen to the end of "spilled" — it buzzes like /d/!' },
      { word: 'landed',  base: 'land',  sound: '/id/', hint: 'Baseword ends in d, so -ed says /id/!' },
      { word: 'rented',  base: 'rent',  sound: '/id/', hint: 'From your chart: rent + ed says /id/!' },
      { word: 'folded',  base: 'fold',  sound: '/id/', hint: 'From your chart: fold + ed says /id/!' },
      { word: 'planted', base: 'plant', sound: '/id/', hint: 'From your chart: plant + ed says /id/!' },
      { word: 'lifted',  base: 'lift',  sound: '/id/', hint: 'From your chart: lift + ed says /id/!' },
      { word: 'smelled', base: 'smell', sound: '/d/',  hint: 'From your chart: smell + ed says /d/!' },
      { word: 'played',  base: 'play',  sound: '/d/',  hint: 'From your chart: play + ed says /d/!' },
      { word: 'jumped',  base: 'jump',  sound: '/t/',  hint: 'From your chart: jump + ed says /t/!' },
      { word: 'dumped',  base: 'dump',  sound: '/t/',  hint: 'From your chart: dump + ed says /t/!' },
      { word: 'helped',  base: 'help',  sound: '/t/',  hint: 'From your chart: help + ed says /t/!' },
      { word: 'walked',  base: 'walk',  sound: '/t/',  hint: 'From your chart: walk + ed says /t/!' }
    ];

    // Section 3: The 6 Trick Words on the worksheet
    const trickWordsList = [
      { word: 'please', sentence: 'Can I please have a cookie?' },
      { word: 'use',    sentence: 'May I use your yellow pencil?' },
      { word: 'used',   sentence: 'She used all the glue.' },
      { word: 'animal', sentence: 'What is your favorite animal?' },
      { word: 'again',  sentence: 'Let us play the game again!' },
      { word: 'there',  sentence: 'Look over there at the turkey!' }
    ];

    // Section 4: Capitalization & Ending Punctuation practice using the Trick Words & Suffix Words
    const sentenceList = [
      { words: ['please', 'pass', 'the', 'boxes'],       punct: '.', hint: 'A polite statement ends with a period (.)' },
      { words: ['what', 'animal', 'hunted', 'there'],    punct: '?', hint: 'Asking "What..." is a question (?)' },
      { words: ['can', 'i', 'use', 'your', 'socks'],     punct: '?', hint: 'Asking "Can I..." needs a question mark (?)' },
      { words: ['he', 'spilled', 'the', 'milk', 'again'], punct: '!', hint: 'Oops! Strong feeling uses an exclamation point (!) or period (.)', allowPeriodToo: true },
      { words: ['the', 'smallest', 'bug', 'landed'],     punct: '.', hint: 'A telling sentence ends with a period (.)' },
      { words: ['she', 'used', 'the', 'oldest', 'brush'], punct: '.', hint: 'A telling sentence ends with a period (.)' }
    ];

    const ALL_SUFFIXES = ['s', 'es', 'ing', 'ed', 'er', 'est'];

    // =========================================================================
    // STATE & AUDIO
    // =========================================================================
    let currentMode = 'scoop';
    let stars = 0;
    let voiceEnabled = true;

    let scoopIdx = 0;
    let scoopStep = 'BASE'; // 'BASE', 'SUFFIX', 'ED_SOUND', 'DONE'
    let scoopCompleted = new Set();

    let edIdx = 0;
    let edCompleted = new Set();

    let trickIdx = 0;
    let trickTyped = [];
    let trickCompleted = new Set();

    let sentIdx = 0;
    let sentCapitalized = false;
    let sentPunct = null;
    let sentCompleted = new Set();

    const stageEl = document.getElementById('game-stage');
    const starCountEl = document.getElementById('star-count');
    const voiceToggleBtn = document.getElementById('voice-toggle');

    // Web Audio Sound Effects
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playChime(freq = 520, type = 'sine', duration = 0.14, vol = 0.22) {
      if (!voiceEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessChord() {
      playChime(523.25, 'sine', 0.12, 0.22);
      setTimeout(() => playChime(659.25, 'sine', 0.12, 0.22), 90);

    window.playAudioClip = function(clipName, fallbackText = '') {
      if (!voiceEnabled) return;
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        const audio = new Audio(`audio/${clipName}.m4a`);
        currentAudio = audio;
        audio.play().catch(err => {
          console.warn('Audio clip play failed, using fallback:', err);
          if (fallbackText) speakFallback(fallbackText);
        });
      } catch (e) {
        if (fallbackText) speakFallback(fallbackText);
      }
    };

      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = rate;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    let shuffledLetters = [];
    function initTrickWord() {
      const item = trickWordsList[trickIdx];
      trickTyped = [];
      shuffledLetters = item.word.split('').map((ch, i) => ({ ch, id: i, used: false }));
      // Shuffle letters ensuring it's not identical if length > 2
      for (let i = shuffledLetters.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledLetters[i], shuffledLetters[j]] = [shuffledLetters[j], shuffledLetters[i]];
      }
    }

    function renderTrickMode() {
      const item = trickWordsList[trickIdx];
      if (shuffledLetters.length === 0) initTrickWord();

      const slotsHTML = item.word.split('').map((_, idx) => {
        const entry = trickTyped[idx];
        return `<div class="spell-slot" onclick="removeTrickLetter(${idx})">${entry ? entry.ch : ''}</div>`;
      }).join('');

      const tilesHTML = shuffledLetters.map((tile, idx) =>
        `<button class="letter-tile ${tile.used ? 'used' : ''}" onclick="tapTrickLetter(${idx})">${tile.ch}</button>`
      ).join('');

    window.tapTrickLetter = function(tileIdx) {
      const item = trickWordsList[trickIdx];
      const tile = shuffledLetters[tileIdx];
      if (tile.used || trickTyped.length >= item.word.length) return;

      const expectedChar = item.word[trickTyped.length];

      if (slotIdx < trickTyped.length) {

    // =========================================================================
    // CONFETTI CELEBRATION
    // =========================================================================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstConfetti() {
      const pieces = Array.from({ length: 70 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 200,
        size: 8 + Math.random() * 8,
        vy: 3 + Math.random() * 4,
        vx: -2 + Math.random() * 4,
        color: ['#2563eb', '#f59e0b', '#16a34a', '#db2777', '#7c3aed'][Math.floor(Math.random() * 5)],
        rot: Math.random() * 360
      }));
      let frames = 0;
      function step() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += 5;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        frames++;
        if (frames < 140) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      step();
    }

      voiceEnabled = !voiceEnabled;
      voiceToggleBtn.textContent = voiceEnabled ? '🔊 Voice On' : '🔇 Muted';
      if (!voiceEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    function renderCurrentMode() {
      if (currentMode === 'scoop') renderScoopMode();
      else if (currentMode === 'edsounds') renderEdSoundsMode();
      else if (currentMode === 'trick') { initTrickWord(); renderTrickMode(); }
      else if (currentMode === 'sentences') renderSentenceMode();
      else if (currentMode === 'chart') renderChartMode();
    }

    updateBadges();
    renderCurrentMode();
  </script>
</body>
</html>
