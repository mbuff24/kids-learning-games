<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fundations Unit 5 Review Adventure! 🦉⭐</title>
  <style>
    :root {
      --bg-top: #ede9fe;
      --bg-bottom: #fef3c7;
      --card-bg: #ffffff;
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --green: #16a34a;
      --green-dark: #15803d;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --pink: #db2777;
      --text-main: #1e293b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Rounded Mplus 1c', system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
    }

    /* Top Header */
    header {
      width: 96%;
      max-width: 1700px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 5px solid var(--primary);
      border-radius: 0 0 28px 28px;
      padding: clamp(10px, 1.2vh, 18px) clamp(20px, 2vw, 32px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .owl-mascot {
      font-size: 2.6rem;
      animation: bob 2.4s infinite ease-in-out;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.5vw, 2rem);
      color: var(--primary-dark);
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.9rem;
      color: #64748b;
      font-weight: bold;
    }

    .score-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-pill {
      background: #fef3c7;
      border: 3px solid var(--amber);
      border-radius: 50px;
      padding: 6px 16px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 var(--amber-dark);
    }

    .sound-btn {
      background: #f3e8ff;
      border: 3px solid var(--primary);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--primary-dark);
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-dark);
      text-decoration: none;
    }

    .sound-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    /* Navigation Tabs */
    .mode-tabs {
      width: 96%;
      max-width: 1700px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 14px 12px 6px;
    }

    .tab-btn {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 20px;
      padding: clamp(10px, 1vh, 14px) clamp(16px, 1.5vw, 24px);
      font-size: clamp(0.95rem, 1.3vw, 1.2rem);
      font-weight: 900;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: white;
      box-shadow: 0 4px 0 #3b0764;
    }

    .tab-badge {
      background: #dcfce7;
      color: #15803d;
      font-size: 0.85rem;
      padding: 2px 7px;
      border-radius: 12px;
      margin-left: 4px;
    }

    /* Main Stage */
    main {
      width: 96%;
      max-width: 1600px;
      padding: 10px 16px 30px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-card {
      width: 100%;
      flex: 1;
      background: var(--card-bg);
      border: 5px solid #c4b5fd;
      border-radius: 32px;
      padding: clamp(22px, 2.5vw, 40px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 460px;
      justify-content: space-between;
      position: relative;
    }

    .progress-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 10px;
    }

    .mode-title {
      font-size: clamp(1.2rem, 2vw, 1.55rem);
      font-weight: 900;
      color: var(--primary-dark);
      margin: 0;
    }

    .step-pill {
      background: #f1f5f9;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: bold;
      color: #475569;
    }

    .prompt-banner {
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      font-weight: 900;
      color: #1e293b;
      background: #fef9c3;
      border: 3px solid #facc15;
      padding: 10px 22px;
      border-radius: 24px;
      margin: 10px 0;
      max-width: 880px;
    }

    /* Fundations Writing Grid Display */
    .fundations-lines {
      position: relative;
      background: #fffbeb;
      border: 4px solid #fbbf24;
      border-radius: 24px;
      padding: 26px 38px 36px;
      margin: 10px 0;
      min-width: 340px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }

    .fundations-lines::before {
      content: "☀️";
      position: absolute;
      left: 12px;
      top: 10px;
      font-size: 1.1rem;
      opacity: 0.75;
    }

    .fundations-lines::after {
      content: "🌱";
      position: absolute;
      left: 12px;
      bottom: 10px;
      font-size: 1.1rem;
      opacity: 0.75;
    }

    /* Word Display with Syllable Scoops, Baseword Underline, Suffix Circle, and Breve + 'c' */
    .word-stage {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-size: clamp(2.4rem, 5.5vw, 4rem);
      font-weight: 900;
      letter-spacing: 2px;
      position: relative;
      padding: 12px 18px 28px;
      gap: 4px;
    }

    .syllable-part {
      position: relative;
      padding: 0 6px;
      color: #1e293b;
      transition: all 0.25s;
    }

    /* Syllable Scoop (blue curve underneath each syllable) */
    .syllable-part.scooped::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -14px;
      height: 18px;
      border-bottom: 6px solid #2563eb;
      border-left: 5px solid #2563eb;
      border-right: 5px solid #2563eb;
      border-radius: 0 0 26px 26px;
      animation: drawScoop 0.35s ease-out;
    }

    /* Closed-syllable 'c' label under the scoop */
    .syllable-part.scooped.closed-c::before {
      content: "c";
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.05rem;
      font-weight: 900;
      color: #2563eb;
    }

    /* Baseword Underline (Unit 5 direction: "underline the baseword and circle the suffix") */
    .baseword-part {
      position: relative;
      padding: 0 6px;
      color: #1e293b;
    }

    .baseword-part.underlined::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -10px;
      height: 6px;
      background: #2563eb;
      border-radius: 4px;
      animation: drawScoop 0.35s ease-out;
    }

    @keyframes drawScoop {
      0% { transform: scaleX(0.2); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    .suffix-part {
      position: relative;
      padding: 2px 12px;
      margin-left: 2px;
      color: #1e293b;
      border: 5px solid transparent;
      border-radius: 50px;
      transition: all 0.25s;
    }

    .suffix-part.circled {
      border-color: #db2777;
      background: #fce7f3;
      color: #be185d;
      animation: popCircle 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popCircle {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    /* Choices & Buttons */
    .choices-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 12px 0;
      width: 100%;
    }

    .choice-btn {
      background: #f5f3ff;
      border: 4px solid var(--primary);
      border-radius: 22px;
      padding: 12px 24px;
      font-size: clamp(1.2rem, 2.4vw, 1.65rem);
      font-weight: 900;
      color: var(--primary-dark);
      cursor: pointer;
      box-shadow: 0 6px 0 var(--primary-dark);
      transition: transform 0.12s, background 0.15s;
      min-width: 115px;
    }

    .choice-btn:hover:not(:disabled) {
      background: #ede9fe;
      transform: translateY(-2px);
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }

    .choice-btn.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
      box-shadow: 0 6px 0 #15803d;
    }

    .choice-btn.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
      box-shadow: 0 6px 0 #b91c1c;
      animation: shake 0.35s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .speak-word-btn {
      background: #fef3c7;
      border: 3px solid var(--amber);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 1.1rem;
      font-weight: 900;
      color: #b45309;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--amber-dark);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .speak-word-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--amber-dark);
    }

    .next-btn {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: 4px solid #dcfce7;
      border-radius: 50px;
      padding: 12px 34px;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #15803d;
      margin-top: 10px;
    }

    /* Rule Poster Banner inside -ick vs -ic */
    .rule-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 6px 0;
    }

    .rule-pill {
      background: #f8fafc;
      border: 3px solid #94a3b8;
      border-radius: 18px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #334155;
      max-width: 340px;
    }

    .rule-pill strong {
      color: var(--primary-dark);
      font-size: 1.15rem;
    }

    /* Spelling Tiles */
    .spell-slots {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
      min-height: 64px;
    }

    .spell-slot {
      width: 56px;
      height: 62px;
      border-bottom: 5px solid #1e293b;
      background: #fff;
      border-radius: 12px 12px 0 0;
      font-size: 2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-dark);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .letter-tile {
      width: 58px;
      height: 62px;
      background: #fef08a;
      border: 3px solid #ca8a04;
      border-radius: 14px;
      font-size: 1.9rem;
      font-weight: 900;
      color: #713f12;
      cursor: pointer;
      box-shadow: 0 5px 0 #a16207;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.2s;
    }

    .letter-tile.used {
      opacity: 0.25;
      pointer-events: none;
      transform: translateY(4px);
    }

    /* Reference Poster / Anchor Chart Cards */
    .anchor-chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      width: 100%;
      margin-top: 12px;
      text-align: left;
    }

    .anchor-box {
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      padding: 14px 16px;
    }

    .anchor-box h4 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .suffix-box-tag {
      border: 3px solid #be185d;
      background: #fce7f3;
      color: #be185d;
      padding: 2px 10px;
      border-radius: 8px;
      font-weight: 900;
    }

    .feedback-msg {
      min-height: 32px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #15803d;
      margin: 6px 0;
    }

    .feedback-msg.error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <header>
    <div class="brand">
      <div class="owl-mascot" title="Echo the Owl!">🦉</div>
      <div>
        <h1>Fundations Unit 5 Adventure!</h1>
        <p>Multisyllabic Words, -ick vs. -ic, Suffixes (-ful, -less, -ness, -ment, -ish, -en, -able) & Trick Words</p>
      </div>
    </div>
    <div class="score-bar">
      <a class="sound-btn" href="../index.html">🏠 Arcade Menu</a>
      <div class="star-pill">⭐ <span id="star-count">0</span> Stars</div>
      <button class="sound-btn" id="voice-toggle">🔊 Voice On</button>
    </div>
  </header>

  <nav class="mode-tabs">
    <button class="tab-btn active" data-mode="wordlist">
      1️⃣ Word List Mark-Up <span class="tab-badge" id="badge-wordlist">0/10</span>
    </button>
    <button class="tab-btn" data-mode="ickvsic">
      2️⃣ -ick vs. -ic Rule <span class="tab-badge" id="badge-ickvsic">0/12</span>
    </button>
    <button class="tab-btn" data-mode="suffixes">
      3️⃣ Unit 5 Suffixes <span class="tab-badge" id="badge-suffixes">0/10</span>
    </button>
    <button class="tab-btn" data-mode="trick">
      4️⃣ Trick Words Test <span class="tab-badge" id="badge-trick">0/5</span>
    </button>
    <button class="tab-btn" data-mode="chart">
      📖 Study Sheet
    </button>
  </nav>

  <main>
    <div class="game-card" id="game-stage"></div>
  </main>

  <script>
    // =========================================================================
    // WORKSHEET SOURCE DATA (From Fundations Unit 5 Word List Review Sheet)
    // =========================================================================

    const UNIT5_SUFFIXES = ['ful', 'less', 'ness', 'ment', 'ish', 'en', 'able', 'ed'];

    // Section 1: The 10 numbered Review Words on the Unit 5 worksheet
    // Key points from worksheet:
    // - Separate words by syllable: scoop each word part and mark it up.
    // - Words with suffixes: underline the baseword and circle the suffix!
    const unit5Words = [
      {
        word: 'mimic',
        hasSuffix: false,
        syllables: ['mim', 'ic'],
        distractorSplits: ['mim-ic', 'mi-mic', 'mimi-c'],
        correctSplit: 'mim-ic',
        sentence: 'The parrot can mimic my voice.',
        note: '2 syllables (mim-ic) — ends in -ic because it has more than 1 syllable!'
      },
      {
        word: 'polish',
        hasSuffix: false,
        syllables: ['pol', 'ish'],
        distractorSplits: ['pol-ish', 'po-lish', 'poli-sh'],
        correctSplit: 'pol-ish',
        sentence: 'Let us polish the shiny silver spoon.',
        note: '2 closed syllables: pol - ish!'
      },
      {
        word: 'invent',
        hasSuffix: false,
        syllables: ['in', 'vent'],
        distractorSplits: ['in-vent', 'inv-ent', 'i-nvent'],
        correctSplit: 'in-vent',
        sentence: 'She wants to invent a flying robot.',
        note: '2 closed syllables: in - vent!'
      },
      {
        word: 'fistful',
        hasSuffix: true,
        base: 'fist',
        suffix: 'ful',
        sentence: 'He grabbed a fistful of popcorn.',
        note: 'Underline baseword "fist" and circle suffix "-ful"!'
      },
      {
        word: 'thankless',
        hasSuffix: true,
        base: 'thank',
        suffix: 'less',
        sentence: 'Cleaning up the mud was a thankless job.',
        note: 'Underline baseword "thank" and circle suffix "-less"!'
      },
      {
        word: 'kindness',
        hasSuffix: true,
        base: 'kind',
        suffix: 'ness',
        sentence: 'Thank you for showing so much kindness!',
        note: 'Underline baseword "kind" and circle suffix "-ness"!'
      },
      {
        word: 'chess',
        hasSuffix: false,
        syllables: ['chess'],
        distractorSplits: ['chess (1 syllable)', 'ch-ess', 'che-ss'],
        correctSplit: 'chess (1 syllable)',
        sentence: 'We played a game of chess after school.',
        note: '1 closed syllable with bonus letter s!'
      },
      {
        word: 'insulted',
        hasSuffix: true,
        base: 'insult',
        baseSyllables: ['in', 'sult'],
        suffix: 'ed',
        sentence: 'Nobody likes to feel insulted.',
        note: '2-syllable baseword "insult" (in-sult) + suffix "-ed" (/id/)!'
      },
      {
        word: 'publish',
        hasSuffix: false,
        syllables: ['pub', 'lish'],
        distractorSplits: ['pub-lish', 'pu-blish', 'publ-ish'],
        correctSplit: 'pub-lish',
        sentence: 'Our class will publish a storybook!',
        note: '2 closed syllables: pub - lish!'
      },
      {
        word: 'himself',
        hasSuffix: false,
        syllables: ['him', 'self'],
        distractorSplits: ['him-self', 'hi-mself', 'hims-elf'],
        correctSplit: 'him-self',
        sentence: 'He tied his shoes all by himself.',
        note: '2 closed syllables: him - self!'
      }
    ];

    // Section 2: "ick vs ic" Anchor Chart from the worksheet
    // Rule:
    // -ick: used in ONE syllable words after a short vowel (lick, kick, pick)
    // -ic:  used in words with MORE than one syllable (picnic, public, panic, toxic, mimic)
    const ickVsIcWords = [
      { word: 'lick',   stem: 'l',    ending: 'ick', syllables: 1, hint: '"lick" has 1 syllable after a short vowel → spell with -ick!' },
      { word: 'picnic', stem: 'picn', ending: 'ic',  syllables: 2, hint: '"pic-nic" has 2 syllables → spell with -ic!' },
      { word: 'kick',   stem: 'k',    ending: 'ick', syllables: 1, hint: '"kick" has 1 syllable after a short vowel → spell with -ick!' },
      { word: 'public', stem: 'publ', ending: 'ic',  syllables: 2, hint: '"pub-lic" has 2 syllables → spell with -ic!' },
      { word: 'pick',   stem: 'p',    ending: 'ick', syllables: 1, hint: '"pick" has 1 syllable after a short vowel → spell with -ick!' },
      { word: 'panic',  stem: 'pan',  ending: 'ic',  syllables: 2, hint: '"pan-ic" has 2 syllables → spell with -ic!' },
      { word: 'toxic',  stem: 'tox',  ending: 'ic',  syllables: 2, hint: '"tox-ic" has 2 syllables → spell with -ic!' },
      { word: 'mimic',  stem: 'mim',  ending: 'ic',  syllables: 2, hint: '"mim-ic" has 2 syllables → spell with -ic!' },
      { word: 'trick',  stem: 'tr',   ending: 'ick', syllables: 1, hint: '"trick" has 1 syllable → spell with -ick!' },
      { word: 'comic',  stem: 'com',  ending: 'ic',  syllables: 2, hint: '"com-ic" has 2 syllables → spell with -ic!' },
      { word: 'thick',  stem: 'th',   ending: 'ick', syllables: 1, hint: '"thick" has 1 syllable → spell with -ick!' },
      { word: 'topic',  stem: 'top',  ending: 'ic',  syllables: 2, hint: '"top-ic" has 2 syllables → spell with -ic!' }
    ];

    // Section 3: All 7 Unit 5 Suffixes (ful, less, ness, ment, ish, en, able)
    const suffixPracticeList = [
      { word: 'fistful',   base: 'fist',   suffix: 'ful',  sentence: 'He grabbed a fistful of popcorn.' },
      { word: 'thankless', base: 'thank',  suffix: 'less', sentence: 'Cleaning up the mud was a thankless job.' },
      { word: 'kindness',  base: 'kind',   suffix: 'ness', sentence: 'Thank you for showing so much kindness!' },
      { word: 'shipment',  base: 'ship',   suffix: 'ment', sentence: 'A big shipment of toys arrived today.' },
      { word: 'childish',  base: 'child',  suffix: 'ish',  sentence: 'The puppy has a playful, childish bark.' },
      { word: 'freshen',   base: 'fresh',  suffix: 'en',   sentence: 'Open the window to freshen the room.' },
      { word: 'washable',  base: 'wash',   suffix: 'able', sentence: 'These markers are washable!' },
      { word: 'helpful',   base: 'help',   suffix: 'ful',  sentence: 'You were very helpful in the kitchen!' },
      { word: 'hopeless',  base: 'hope',   suffix: 'less', sentence: 'Never give up, it is not hopeless!' },
      { word: 'sadness',   base: 'sad',    suffix: 'ness', sentence: 'A hug can chase away sadness.' }
    ];

    // Section 4: The 5 Trick Words on the Unit 5 worksheet ("***These trick words will be on the test***")
    const trickWordsList = [
      { word: 'know',    sentence: 'Do you know the answer to the riddle?' },

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playChime(freq = 520, type = 'sine', duration = 0.14, vol = 0.22) {
      if (!voiceEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessChord() {
      playChime(523.25, 'sine', 0.12, 0.22);
      setTimeout(() => playChime(659.25, 'sine', 0.12, 0.22), 90);
      setTimeout(() => playChime(783.99, 'sine', 0.24, 0.25), 180);

    let currentAudio = null;

      if (!voiceEnabled) return;
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        const audio = new Audio(`audio/${clipName}.m4a`);
        currentAudio = audio;
        audio.play().catch(() => {
          if (fallbackText) speakFallback(fallbackText);
        });
      } catch (e) {
        if (fallbackText) speakFallback(fallbackText);
      }
    };

    function speakFallback(text, rate = 0.9) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = rate;
          window.speechSynthesis.speak(u);

    }

    function initTrickWord() {
      const item = trickWordsList[trickIdx];
      trickTyped = [];
      shuffledLetters = item.word.split('').map((ch, i) => ({ ch, id: i, used: false }));
      for (let i = shuffledLetters.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledLetters[i], shuffledLetters[j]] = [shuffledLetters[j], shuffledLetters[i]];
      }
    }

      const item = trickWordsList[trickIdx];

      const slotsHTML = item.word.split('').map((_, idx) => {
        const entry = trickTyped[idx];
        return `<div class="spell-slot" onclick="removeTrickLetter(${idx})">${entry ? entry.ch : ''}</div>`;
      }).join('');

      const tilesHTML = shuffledLetters.map((tile, idx) =>
        `<button class="letter-tile ${tile.used ? 'used' : ''}" onclick="tapTrickLetter(${idx})">${tile.ch}</button>`
      ).join('');

                         trickTyped.map(t => t.ch).join('') === item.word;

    window.tapTrickLetter = function(tileIdx) {
      const item = trickWordsList[trickIdx];
      const tile = shuffledLetters[tileIdx];
      if (tile.used || trickTyped.length >= item.word.length) return;

      const expectedChar = item.word[trickTyped.length];
      if (tile.ch === expectedChar) {
        tile.used = true;
        trickTyped.push(tile);
        playChime(440 + trickTyped.length * 45, 'sine', 0.12, 0.22);

    // =========================================================================
    // CONFETTI
    // =========================================================================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstConfetti() {
      const pieces = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 200,
        size: 8 + Math.random() * 8,
        vy: 3 + Math.random() * 4,
        vx: -2 + Math.random() * 4,
        color: ['#7c3aed', '#f59e0b', '#16a34a', '#db2777', '#2563eb'][Math.floor(Math.random() * 5)],
        rot: Math.random() * 360
      }));
      let frames = 0;
      function step() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += 5;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        frames++;
        if (frames < 140) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      step();
    }

    // =========================================================================
    // NAVIGATION & INIT
    // =========================================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        renderCurrentMode();
      });
    });

    voiceToggleBtn.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceToggleBtn.textContent = voiceEnabled ? '🔊 Voice On' : '🔇 Muted';
      if (!voiceEnabled && currentAudio) currentAudio.pause();
    });

    function renderCurrentMode() {
      if (currentMode === 'wordlist') renderWordListMode();
      else if (currentMode === 'ickvsic') renderIckVsIcMode();
      else if (currentMode === 'suffixes') renderSuffixesMode();
      else if (currentMode === 'trick') { initTrickWord(); renderTrickMode(); }
      else if (currentMode === 'chart') renderChartMode();
    }

    updateBadges();
    renderCurrentMode();
  </script>
</body>
</html>
