<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pre-K Alphabet & Words Adventure! 🔤🧸🌈</title>
  <style>
    :root {
      --bg-top: #fef9c3;
      --bg-mid: #e0f2fe;
      --bg-bot: #fce7f3;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #16a34a;
      --green-dark: #15803d;
      --amber: #f59e0b;
      --amber-dark: #d97706;
      --pink: #db2777;
      --purple: #7c3aed;
      --text-dark: #1e293b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Rounded Mplus 1c', system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 250;
    }

    /* Header */
    header {
      width: 96%;
      max-width: 1800px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 5px solid var(--amber);
      border-radius: 0 0 28px 28px;
      padding: clamp(10px, 1.3vh, 18px) clamp(18px, 2vw, 32px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mascot {
      font-size: 2.8rem;
      animation: bounce 2.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.6vw, 2.15rem);
      color: #1e3a8a;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.95rem;
      color: #64748b;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .star-pill {
      background: #fef3c7;
      border: 3px solid var(--amber);
      border-radius: 50px;
      padding: 6px 18px;
      font-size: 1.25rem;
      font-weight: 900;
      color: #b45309;
      box-shadow: 0 3px 0 var(--amber-dark);
    }

    .top-btn {
      background: #eff6ff;
      border: 3px solid var(--primary);
      border-radius: 50px;
      padding: 6px 16px;
      font-size: 1rem;
      font-weight: 900;
      color: var(--primary-dark);
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary-dark);
      text-decoration: none;
    }

    .top-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    /* Navigation Tabs */
    .mode-tabs {
      width: 96%;
      max-width: 1800px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 14px 12px 6px;
    }

    .tab-btn {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 22px;
      padding: clamp(10px, 1.1vh, 15px) clamp(16px, 1.6vw, 26px);
      font-size: clamp(1rem, 1.4vw, 1.3rem);
      font-weight: 900;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 5px 0 #94a3b8;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: #1e40af;
      color: white;
      box-shadow: 0 5px 0 #1e3a8a;
    }

    /* Main Stage */
    main {
      width: 96%;
      max-width: 1700px;
      padding: 10px 16px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage-card {
      width: 100%;
      flex: 1;
      background: #ffffff;
      border: 5px solid #93c5fd;
      border-radius: 34px;
      padding: clamp(18px, 2.2vw, 34px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 480px;
      justify-content: space-between;
    }

    .prompt-banner {
      font-size: clamp(1.2rem, 2.3vw, 1.65rem);
      font-weight: 900;
      color: #1e293b;
      background: #fef9c3;
      border: 3px solid #facc15;
      padding: 10px 24px;
      border-radius: 26px;
      margin: 6px 0 12px;
      max-width: 920px;
    }

    /* Mode 1: A-Z Alphabet Soundboard Grid */
    .alphabet-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .alpha-tile {
      background: #fffbeb;
      border: 3.5px solid #fcd34d;
      border-radius: 22px;
      padding: 10px 8px;
      cursor: pointer;
      box-shadow: 0 5px 0 #d97706;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.15s, background 0.15s;
    }

    .alpha-tile:hover {
      background: #fef3c7;
      transform: translateY(-3px) scale(1.03);
    }

    .alpha-tile:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d97706;
    }

    .alpha-letters {
      font-size: clamp(1.6rem, 2.6vw, 2.2rem);
      font-weight: 900;
      color: #1d4ed8;
      line-height: 1;
    }

    .alpha-emoji {
      font-size: clamp(2rem, 3.2vw, 2.7rem);
      line-height: 1.1;
    }

    .alpha-word {
      font-size: 1rem;
      font-weight: 900;
      color: #475569;
      text-transform: capitalize;
    }

    /* Mode 2 & 3: Sound Matcher & Small Words CVC Builder */
    .big-showcase {
      background: #fffbeb;
      border: 5px solid #fbbf24;
      border-radius: 30px;
      padding: 20px 36px;
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
    }

    .showcase-emoji {
      font-size: clamp(4.5rem, 8vw, 6.5rem);
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
    }

    .speak-btn {
      background: #fef3c7;
      border: 3.5px solid var(--amber);
      border-radius: 50px;
      padding: 10px 24px;
      font-size: clamp(1.1rem, 1.8vw, 1.35rem);
      font-weight: 900;
      color: #b45309;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--amber-dark);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .speak-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--amber-dark);
    }

    .choices-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 12px 0;
      width: 100%;
    }

    .big-choice-card {
      background: #eff6ff;
      border: 4px solid #3b82f6;
      border-radius: 26px;
      padding: 16px 28px;
      min-width: 160px;
      cursor: pointer;
      box-shadow: 0 7px 0 #1d4ed8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s, background 0.15s;
    }

    .big-choice-card:hover {
      background: #dbeafe;
      transform: translateY(-3px);
    }

    .big-choice-card:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1d4ed8;
    }

    .big-choice-card.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #15803d;
      box-shadow: 0 7px 0 #15803d;
    }

    .big-choice-card.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
      box-shadow: 0 7px 0 #b91c1c;
      animation: wiggle 0.35s;
    }

    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    /* CVC Letter Slots & Big Letter Tiles */
    .cvc-slots {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 10px 0;
    }

    .cvc-slot {
      width: clamp(68px, 9vw, 90px);
      height: clamp(74px, 10vw, 96px);
      border-bottom: 6px solid #1e293b;
      background: #ffffff;
      border-radius: 18px 18px 0 0;
      font-size: clamp(2.4rem, 4vw, 3.2rem);
      font-weight: 900;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .cvc-tile {
      width: clamp(68px, 9vw, 88px);
      height: clamp(72px, 9.5vw, 92px);
      background: #fef08a;
      border: 4px solid #ca8a04;
      border-radius: 20px;
      font-size: clamp(2.2rem, 3.8vw, 3rem);
      font-weight: 900;
      color: #713f12;
      cursor: pointer;
      box-shadow: 0 6px 0 #a16207;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cvc-tile.used {
      opacity: 0.25;
      pointer-events: none;
      transform: translateY(4px);
    }

    /* Mode 4: Pre-K Kid-Friendly Word Search (5x5 Grid with Picture Clues!) */
    .wordsearch-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 10px 0;
    }

    .ws-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: #e0f2fe;
      border: 5px solid #38bdf8;
      border-radius: 26px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.1);
    }

    .ws-cell {
      width: clamp(56px, 7.5vw, 76px);
      height: clamp(56px, 7.5vw, 76px);
      background: #ffffff;
      border: 3.5px solid #93c5fd;
      border-radius: 16px;
      font-size: clamp(1.7rem, 2.8vw, 2.3rem);
      font-weight: 900;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #60a5fa;
      transition: transform 0.12s, background 0.15s;
    }

    .ws-cell.selected {
      background: #fef08a;
      border-color: #eab308;
      color: #854d0e;
      transform: scale(1.06);
      box-shadow: 0 4px 0 #ca8a04;
    }

    .ws-cell.found {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      box-shadow: 0 4px 0 #16a34a;
    }

    .ws-clues {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 240px;
    }

    .ws-clue-card {
      background: #fffbeb;
      border: 3.5px solid #fcd34d;
      border-radius: 20px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 1.45rem;
      font-weight: 900;
      color: #1e293b;
      cursor: pointer;
      box-shadow: 0 4px 0 #d97706;
    }

    .ws-clue-card.clue-found {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      text-decoration: line-through;
      box-shadow: 0 4px 0 #16a34a;
    }

    .next-btn {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: 4px solid #dcfce7;
      border-radius: 50px;
      padding: 10px 30px;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #15803d;
      margin-top: 8px;
    }

    .feedback-msg {
      min-height: 32px;
      font-size: 1.25rem;
      font-weight: 900;
      color: #15803d;
      margin: 6px 0;
    }

    .feedback-msg.error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <header>
    <div class="brand">
      <div class="mascot">🧸</div>
      <div>
        <h1>Pre-K Alphabet & Words Adventure!</h1>
        <p>A–Z Letter Sounds, Matching Sounds to Words, Small 3-Letter Words & Picture Word Search</p>
      </div>
    </div>
    <div class="header-actions">
      <a class="top-btn" href="../index.html">🏠 Arcade Menu</a>
      <div class="star-pill">⭐ <span id="star-count">0</span> Stars</div>
      <button class="top-btn" id="voice-toggle">🔊 Voice On</button>
    </div>
  </header>

  <nav class="mode-tabs">
    <button class="tab-btn active" data-mode="alphabet">
      🔤 1. A–Z Alphabet Zoo
    </button>
    <button class="tab-btn" data-mode="soundmatch">
      🎧 2. Match Sounds to Words
    </button>
    <button class="tab-btn" data-mode="smallwords">
      🧩 3. Build Small Words
    </button>
    <button class="tab-btn" data-mode="wordsearch">
      🔍 4. Picture Word Search
    </button>
    <button class="tab-btn" data-mode="lettermatch">
      🅰️ 5. Big & Little Letters
    </button>
  </nav>

  <main>
    <div class="stage-card" id="stage-card"></div>
  </main>

  <script>
    // =========================================================================
    // PRE-K CURRICULUM DATA
    // =========================================================================
    const ALPHABET = [
      { key: 'a', upper: 'A', lower: 'a', word: 'apple',    emoji: '🍎', soundHint: '/a/ like apple' },
      { key: 'b', upper: 'B', lower: 'b', word: 'ball',     emoji: '⚽', soundHint: '/b/ like ball' },
      { key: 'c', upper: 'C', lower: 'c', word: 'cat',      emoji: '🐱', soundHint: '/k/ like cat' },
      { key: 'd', upper: 'D', lower: 'd', word: 'dog',      emoji: '🐶', soundHint: '/d/ like dog' },
      { key: 'e', upper: 'E', lower: 'e', word: 'elephant', emoji: '🐘', soundHint: '/e/ like elephant' },
      { key: 'f', upper: 'F', lower: 'f', word: 'fish',     emoji: '🐟', soundHint: '/f/ like fish' },
      { key: 'g', upper: 'G', lower: 'g', word: 'goat',     emoji: '🐐', soundHint: '/g/ like goat' },
      { key: 'h', upper: 'H', lower: 'h', word: 'hat',      emoji: '🎩', soundHint: '/h/ like hat' },
      { key: 'i', upper: 'I', lower: 'i', word: 'igloo',    emoji: '🧊', soundHint: '/i/ like igloo' },
      { key: 'j', upper: 'J', lower: 'j', word: 'jam',      emoji: '🍓', soundHint: '/j/ like jam' },
      { key: 'k', upper: 'K', lower: 'k', word: 'kite',     emoji: '🪁', soundHint: '/k/ like kite' },
      { key: 'l', upper: 'L', lower: 'l', word: 'lion',     emoji: '🦁', soundHint: '/l/ like lion' },
      { key: 'm', upper: 'M', lower: 'm', word: 'monkey',   emoji: '🐵', soundHint: '/m/ like monkey' },
      { key: 'n', upper: 'N', lower: 'n', word: 'nest',     emoji: '🪺', soundHint: '/n/ like nest' },
      { key: 'o', upper: 'O', lower: 'o', word: 'octopus',  emoji: '🐙', soundHint: '/o/ like octopus' },
      { key: 'p', upper: 'P', lower: 'p', word: 'pig',      emoji: '🐷', soundHint: '/p/ like pig' },
      { key: 'q', upper: 'Q', lower: 'q', word: 'queen',    emoji: '👑', soundHint: '/kw/ like queen' },
      { key: 'r', upper: 'R', lower: 'r', word: 'rabbit',   emoji: '🐰', soundHint: '/r/ like rabbit' },
      { key: 's', upper: 'S', lower: 's', word: 'sun',      emoji: '☀️', soundHint: '/s/ like sun' },
      { key: 't', upper: 'T', lower: 't', word: 'turtle',   emoji: '🐢', soundHint: '/t/ like turtle' },
      { key: 'u', upper: 'U', lower: 'u', word: 'umbrella', emoji: '☂️', soundHint: '/u/ like umbrella' },
      { key: 'v', upper: 'V', lower: 'v', word: 'van',      emoji: '🚐', soundHint: '/v/ like van' },
      { key: 'w', upper: 'W', lower: 'w', word: 'whale',    emoji: '🐳', soundHint: '/w/ like whale' },
      { key: 'x', upper: 'X', lower: 'x', word: 'fox',      emoji: '🦊', soundHint: '/ks/ in fox' },
      { key: 'y', upper: 'Y', lower: 'y', word: 'yo-yo',    emoji: '🪀', soundHint: '/y/ like yo-yo' },
      { key: 'z', upper: 'Z', lower: 'z', word: 'zebra',    emoji: '🦓', soundHint: '/z/ like zebra' }
    ];

    const SMALL_WORDS = [
      { word: 'CAT', key: 'cat', emoji: '🐱' },
      { word: 'DOG', key: 'dog', emoji: '🐶' },
      { word: 'SUN', key: 'sun', emoji: '☀️' },
      { word: 'PIG', key: 'pig', emoji: '🐷' },
      { word: 'HAT', key: 'hat', emoji: '🎩' },
      { word: 'BUG', key: 'bug', emoji: '🐞' },
      { word: 'BUS', key: 'bus', emoji: '🚌' },
      { word: 'CUP', key: 'cup', emoji: '🥤' },
      { word: 'FOX', key: 'fox', emoji: '🦊' },
      { word: 'BED', key: 'bed', emoji: '🛏️' },
      { word: 'BAT', key: 'bat', emoji: '🦇' },
      { word: 'HEN', key: 'hen', emoji: '🐔' }
    ];

    // Kid-Friendly 5x5 Word Search Puzzles (3 horizontal words per puzzle so 4-year-olds can tap letters left-to-right!)
    const WORD_SEARCH_PUZZLES = [
      {
        title: 'Animal Friends Puzzle',
        grid: [
          ['C', 'A', 'T', 'M', 'P'],
          ['B', 'L', 'D', 'O', 'G'],
          ['P', 'I', 'G', 'R', 'S'],
          ['K', 'W', 'N', 'T', 'V'],
          ['F', 'O', 'X', 'H', 'Z']
        ],
        words: [
          { word: 'CAT', key: 'cat', emoji: '🐱', cells: [[0,0],[0,1],[0,2]] },
          { word: 'DOG', key: 'dog', emoji: '🐶', cells: [[1,2],[1,3],[1,4]] },
          { word: 'PIG', key: 'pig', emoji: '🐷', cells: [[2,0],[2,1],[2,2]] },
          { word: 'FOX', key: 'fox', emoji: '🦊', cells: [[4,0],[4,1],[4,2]] }
        ]
      },
      {
        title: 'Sunny Day Puzzle',
        grid: [
          ['S', 'U', 'N', 'B', 'K'],
          ['M', 'H', 'A', 'T', 'R'],
          ['B', 'U', 'G', 'L', 'P'],
          ['D', 'F', 'C', 'U', 'P'],
          ['B', 'U', 'S', 'W', 'J']
        ],
        words: [
          { word: 'SUN', key: 'sun', emoji: '☀️', cells: [[0,0],[0,1],[0,2]] },
          { word: 'HAT', key: 'hat', emoji: '🎩', cells: [[1,1],[1,2],[1,3]] },
          { word: 'BUG', key: 'bug', emoji: '🐞', cells: [[2,0],[2,1],[2,2]] },
          { word: 'BUS', key: 'bus', emoji: '🚌', cells: [[4,0],[4,1],[4,2]] }
        ]
      },
      {
        title: 'Cozy Home Puzzle',
        grid: [
          ['B', 'E', 'D', 'M', 'T'],
          ['R', 'C', 'U', 'P', 'L'],
          ['H', 'E', 'N', 'S', 'K'],
          ['B', 'A', 'T', 'P', 'G'],
          ['W', 'J', 'C', 'A', 'T']
        ],
        words: [
          { word: 'BED', key: 'bed', emoji: '🛏️', cells: [[0,0],[0,1],[0,2]] },
          { word: 'CUP', key: 'cup', emoji: '🥤', cells: [[1,1],[1,2],[1,3]] },
          { word: 'HEN', key: 'hen', emoji: '🐔', cells: [[2,0],[2,1],[2,2]] },
          { word: 'BAT', key: 'bat', emoji: '🦇', cells: [[3,0],[3,1],[3,2]] }
        ]
      }
    ];

    // =========================================================================
    // STATE & AUDIO
    // =========================================================================
    let currentMode = 'alphabet';
    let stars = 0;
    let voiceEnabled = true;

    let soundMatchIdx = 0;
    let soundMatchChoices = [];

    let cvcIdx = 0;
    let cvcTyped = [];
    let cvcTiles = [];

    let wsPuzzleIdx = 0;
    let wsFoundWords = new Set();
    let wsSelectedCells = new Set();

    let letterMatchIdx = 0;
    let letterMatchOptions = [];

    const stageEl = document.getElementById('stage-card');
    const starCountEl = document.getElementById('star-count');
    const voiceToggleBtn = document.getElementById('voice-toggle');

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playChime(freq = 520, type = 'sine', duration = 0.14, vol = 0.22) {
      if (!voiceEnabled) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessChord() {
      playChime(523.25, 'sine', 0.12, 0.22);
      setTimeout(() => playChime(659.25, 'sine', 0.12, 0.22), 90);
      setTimeout(() => playChime(783.99, 'sine', 0.24, 0.25), 180);
    }

    function playErrorBuzz() {
      playChime(200, 'sawtooth', 0.18, 0.16);
    }

    let currentAudio = null;
    window.playAudioClip = function(clipName, fallbackText = '') {
      if (!voiceEnabled) return;
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        const audio = new Audio(`audio/${clipName}.m4a`);
        currentAudio = audio;
        audio.play().catch(() => {
          if (fallbackText) speakFallback(fallbackText);
        });
      } catch (e) {
        if (fallbackText) speakFallback(fallbackText);
      }
    };

    function speakFallback(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }, 35);
      } catch (e) {}
    }

    function awardStars(n = 1) {
      stars += n;
      starCountEl.textContent = stars;
    }

    // =========================================================================
    // MODE 1: A-Z ALPHABET SOUNDBOARD ZOO
    // =========================================================================
    function renderAlphabetMode() {
      const tilesHTML = ALPHABET.map(item => `
        <div class="alpha-tile" onclick="onAlphaTileClick('${item.key}', '${item.upper} is for ${item.word}')">
          <div class="alpha-letters">${item.upper}${item.lower}</div>
          <div class="alpha-emoji">${item.emoji}</div>
          <div class="alpha-word">${item.word}</div>
        </div>
      `).join('');

      stageEl.innerHTML = `
        <div class="prompt-banner">
          🔤 Tap any letter from <strong>A to Z</strong> to hear its name, sound, and word!
        </div>
        <div class="alphabet-grid">${tilesHTML}</div>
      `;
    }

    window.onAlphaTileClick = function(key, fallback) {
      playChime(587.33, 'sine', 0.1, 0.15);
      playAudioClip(`alpha_${key}`, fallback);
    };

    // =========================================================================
    // MODE 2: MATCH SOUNDS TO WORDS (Beginning Letter Sound Matching)
    // =========================================================================
    function setupSoundMatchQuestion() {
      const target = ALPHABET[soundMatchIdx % ALPHABET.length];
      const pool = ALPHABET.filter(a => a.key !== target.key);
      const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 2);
      soundMatchChoices = [target, ...shuffled].sort(() => Math.random() - 0.5);
    }

    function renderSoundMatchMode() {
      const target = ALPHABET[soundMatchIdx % ALPHABET.length];
      if (soundMatchChoices.length === 0) setupSoundMatchQuestion();

      const choicesHTML = soundMatchChoices.map(item => `
        <button class="big-choice-card" onclick="checkSoundMatch(this, '${item.key}')">
          <span style="font-size:3.6rem;">${item.emoji}</span>
          <span style="font-size:1.4rem;font-weight:900;color:#1e293b;text-transform:capitalize;">${item.word}</span>
        </button>
      `).join('');

      stageEl.innerHTML = `
        <div class="prompt-banner">
          🎧 Which picture starts with the letter <strong>${target.upper}${target.lower}</strong> (${target.soundHint})?
        </div>

        <div class="big-showcase">
          <div style="font-size:clamp(4rem, 7vw, 5.5rem);font-weight:900;color:#1d4ed8;line-height:1;">
            ${target.upper}${target.lower}
          </div>
          <button class="speak-btn" onclick="playAudioClip('alpha_${target.key}', '${target.upper} is for ${target.word}')">
            🔊 Hear Letter Sound
          </button>
        </div>

        <div class="choices-row">${choicesHTML}</div>
        <div class="feedback-msg" id="sm-feedback">Tap the matching picture!</div>
      `;
    }

    window.checkSoundMatch = function(btn, chosenKey) {
      const target = ALPHABET[soundMatchIdx % ALPHABET.length];
      const fb = document.getElementById('sm-feedback');
      if (chosenKey === target.key) {
        btn.classList.add('correct');
        playSuccessChord();
        awardStars(1);
        fb.className = 'feedback-msg';
        fb.textContent = `🎉 Yes! ${target.upper} is for ${target.word.toUpperCase()}!`;
        playAudioClip(`alpha_${target.key}`, `${target.upper} is for ${target.word}`);
        setTimeout(() => {
          soundMatchIdx++;
          setupSoundMatchQuestion();
          if (soundMatchIdx % 6 === 0) burstConfetti();
          renderSoundMatchMode();
        }, 1400);
      } else {
        btn.classList.add('wrong');
        playErrorBuzz();
        fb.className = 'feedback-msg error';
        fb.textContent = `Try again! Listen for the "${target.upper}" sound at the beginning!`;
        setTimeout(() => btn.classList.remove('wrong'), 450);
      }
    };

    // =========================================================================
    // MODE 3: BUILD SMALL 3-LETTER WORDS (CAT, DOG, SUN, PIG, HAT, BUG...)
    // =========================================================================
    function initCvcWord() {
      const item = SMALL_WORDS[cvcIdx % SMALL_WORDS.length];
      cvcTyped = [];
      cvcTiles = item.word.split('').map((ch, i) => ({ ch, id: i, used: false }));
      // Add 1 extra distractor letter so kids look carefully
      const extraLetters = ['M', 'R', 'L', 'K'].filter(l => !item.word.includes(l));
      cvcTiles.push({ ch: extraLetters[cvcIdx % extraLetters.length], id: 99, used: false });
      cvcTiles.sort(() => Math.random() - 0.5);
    }

    function renderSmallWordsMode() {
      const item = SMALL_WORDS[cvcIdx % SMALL_WORDS.length];
      if (cvcTiles.length === 0) initCvcWord();

      const slotsHTML = item.word.split('').map((expected, idx) => {
        const entry = cvcTyped[idx];
        return `
          <div class="cvc-slot" onclick="undoCvcLetter(${idx})" title="Tap to undo">
            ${entry ? entry.ch : `<span style="color:#cbd5e1;font-size:1.8rem;">${expected}</span>`}
          </div>
        `;
      }).join('');

      const tilesHTML = cvcTiles.map((t, idx) => `
        <button class="cvc-tile ${t.used ? 'used' : ''}" onclick="tapCvcTile(${idx})">${t.ch}</button>
      `).join('');

      const isDone = cvcTyped.length === item.word.length;

      stageEl.innerHTML = `
        <div class="prompt-banner">
          🧩 Tap the letters in order to spell the small word <strong>"${item.word}"</strong>!
        </div>

        <div class="big-showcase">
          <div class="showcase-emoji">${item.emoji}</div>
          <button class="speak-btn" onclick="playAudioClip('cvc_${item.key}', '${item.word}')">
            🔊 Say "${item.word}"
          </button>
        </div>

        <div class="cvc-slots">${slotsHTML}</div>
        <div class="choices-row">${tilesHTML}</div>

        <div class="feedback-msg" id="cvc-feedback">
          ${isDone ? `🌟 You spelled ${item.word}!` : `Match the 3 letters to build ${item.word}!`}
        </div>

        ${isDone ? `<button class="next-btn" onclick="nextCvcWord()">Next Small Word ➡️</button>` : ''}
      `;
    }

    window.tapCvcTile = function(idx) {
      const item = SMALL_WORDS[cvcIdx % SMALL_WORDS.length];
      const tile = cvcTiles[idx];
      if (tile.used || cvcTyped.length >= item.word.length) return;

      const expected = item.word[cvcTyped.length];
      if (tile.ch === expected) {
        tile.used = true;
        cvcTyped.push(tile);
        playChime(440 + cvcTyped.length * 55, 'sine', 0.12, 0.22);

        if (cvcTyped.length === item.word.length) {
          playSuccessChord();
          awardStars(2);
          playAudioClip(`cvc_${item.key}`, item.word);
        }
        renderSmallWordsMode();
      } else {
        playErrorBuzz();
        const fb = document.getElementById('cvc-feedback');
        if (fb) {
          fb.className = 'feedback-msg error';
          fb.textContent = `Look at the gray helper letter — find the "${expected}" tile!`;
        }
      }
    };

    window.undoCvcLetter = function(slotIdx) {
      if (slotIdx < cvcTyped.length) {
        const removed = cvcTyped.splice(slotIdx);
        removed.forEach(r => r.used = false);
        renderSmallWordsMode();
      }
    };

    window.nextCvcWord = function() {
      cvcIdx++;
      initCvcWord();
      if (cvcIdx % 4 === 0) burstConfetti();
      renderSmallWordsMode();
    };

    // =========================================================================
    // MODE 4: PICTURE WORD SEARCH (5x5 Grid with 3-Letter Words)
    // =========================================================================
    function initWordSearch() {
      wsFoundWords = new Set();
      wsSelectedCells = new Set();
    }

    function isCellInFoundWord(puzzle, r, c) {
      for (const w of puzzle.words) {
        if (wsFoundWords.has(w.word)) {
          if (w.cells.some(([wr, wc]) => wr === r && wc === c)) return true;
        }
      }
      return false;
    }

    function renderWordSearchMode() {
      const puzzle = WORD_SEARCH_PUZZLES[wsPuzzleIdx % WORD_SEARCH_PUZZLES.length];

      let gridHTML = '';
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const key = `${r},${c}`;
          const isFound = isCellInFoundWord(puzzle, r, c);
          const isSel = wsSelectedCells.has(key);
          gridHTML += `
            <div class="ws-cell ${isFound ? 'found' : ''} ${isSel ? 'selected' : ''}"
                 onclick="tapWsCell(${r}, ${c})">
              ${puzzle.grid[r][c]}
            </div>
          `;
        }
      }

      const cluesHTML = puzzle.words.map(w => {
        const found = wsFoundWords.has(w.word);
        return `
          <div class="ws-clue-card ${found ? 'clue-found' : ''}"
               onclick="playAudioClip('cvc_${w.key}', '${w.word}')">
            <span>${w.emoji} ${w.word}</span>
            <span>${found ? '✅' : '🔊'}</span>
          </div>
        `;
      }).join('');

      const allFound = wsFoundWords.size === puzzle.words.length;

      stageEl.innerHTML = `
        <div class="prompt-banner">
          🔍 <strong>${puzzle.title}:</strong> Find the 4 small words going across! Tap each letter in the word!
        </div>

        <div class="wordsearch-layout">
          <div class="ws-grid">${gridHTML}</div>
          <div class="ws-clues">${cluesHTML}</div>
        </div>

        <div class="feedback-msg" id="ws-feedback">
          ${allFound ? '🎉 Hooray! You found all 4 words in the puzzle!' : `Found ${wsFoundWords.size} of ${puzzle.words.length} words!`}
        </div>

        ${allFound ? `<button class="next-btn" onclick="nextWordSearchPuzzle()">Next Word Search Puzzle ➡️</button>` : ''}
      `;
    }

    window.tapWsCell = function(r, c) {
      const puzzle = WORD_SEARCH_PUZZLES[wsPuzzleIdx % WORD_SEARCH_PUZZLES.length];
      const key = `${r},${c}`;

      if (wsSelectedCells.has(key)) {
        wsSelectedCells.delete(key);
      } else {
        wsSelectedCells.add(key);
        playChime(460, 'sine', 0.09, 0.18);
      }

      // Check if any unfound word now has all 3 of its cells selected!
      for (const w of puzzle.words) {
        if (!wsFoundWords.has(w.word)) {
          const allCellsTapped = w.cells.every(([wr, wc]) => wsSelectedCells.has(`${wr},${wc}`));
          if (allCellsTapped) {
            wsFoundWords.add(w.word);
            w.cells.forEach(([wr, wc]) => wsSelectedCells.delete(`${wr},${wc}`));
            playSuccessChord();
            awardStars(2);
            playAudioClip(`cvc_${w.key}`, w.word);
            if (wsFoundWords.size === puzzle.words.length) {
              burstConfetti();
            }
          }
        }
      }

      renderWordSearchMode();
    };

    window.nextWordSearchPuzzle = function() {
      wsPuzzleIdx++;
      initWordSearch();
      renderWordSearchMode();
    };

    // =========================================================================
    // MODE 5: BIG & LITTLE LETTER MATCHING (Uppercase A <-> Lowercase a)
    // =========================================================================
    function setupLetterMatch() {
      const target = ALPHABET[letterMatchIdx % ALPHABET.length];
      const pool = ALPHABET.filter(a => a.key !== target.key);
      const distractors = pool.sort(() => Math.random() - 0.5).slice(0, 2);
      letterMatchOptions = [target, ...distractors].sort(() => Math.random() - 0.5);
    }

    function renderLetterMatchMode() {
      const target = ALPHABET[letterMatchIdx % ALPHABET.length];
      if (letterMatchOptions.length === 0) setupLetterMatch();

      const choicesHTML = letterMatchOptions.map(item => `
        <button class="big-choice-card" onclick="checkLetterMatch(this, '${item.key}')">
          <span style="font-size:4rem;font-weight:900;color:#1d4ed8;">${item.lower}</span>
        </button>
      `).join('');

      stageEl.innerHTML = `
        <div class="prompt-banner">
          🅰️ Find the little lowercase partner for Big Letter <strong>"${target.upper}"</strong>!
        </div>

        <div class="big-showcase">
          <div style="font-size:5rem;font-weight:900;color:#1e3a8a;line-height:1;">
            ${target.upper}
          </div>
          <div style="font-size:2.4rem;">${target.emoji} ${target.word}</div>
          <button class="speak-btn" onclick="playAudioClip('alpha_${target.key}', '${target.upper}')">
            🔊 Hear Letter "${target.upper}"
          </button>
        </div>

        <div class="choices-row">${choicesHTML}</div>
        <div class="feedback-msg" id="lm-feedback">Tap the matching lowercase letter!</div>
      `;
    }

    window.checkLetterMatch = function(btn, chosenKey) {
      const target = ALPHABET[letterMatchIdx % ALPHABET.length];
      const fb = document.getElementById('lm-feedback');
      if (chosenKey === target.key) {
        btn.classList.add('correct');
        playSuccessChord();
        awardStars(1);
        fb.className = 'feedback-msg';
        fb.textContent = `🌟 Great job! Big ${target.upper} and little ${target.lower}!`;
        playAudioClip(`alpha_${target.key}`, `${target.upper} is for ${target.word}`);
        setTimeout(() => {
          letterMatchIdx++;
          setupLetterMatch();
          if (letterMatchIdx % 6 === 0) burstConfetti();
          renderLetterMatchMode();
        }, 1250);
      } else {
        btn.classList.add('wrong');
        playErrorBuzz();
        fb.className = 'feedback-msg error';
        fb.textContent = `Look closely for little "${target.lower}"!`;
        setTimeout(() => btn.classList.remove('wrong'), 450);
      }
    };

    // =========================================================================
    // CONFETTI
    // =========================================================================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstConfetti() {
      const pieces = Array.from({ length: 75 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 200,
        size: 8 + Math.random() * 8,
        vy: 3 + Math.random() * 4,
        vx: -2 + Math.random() * 4,
        color: ['#2563eb', '#f59e0b', '#16a34a', '#db2777', '#7c3aed'][Math.floor(Math.random() * 5)],
        rot: Math.random() * 360
      }));
      let frames = 0;
      function step() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += 5;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        frames++;
        if (frames < 140) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      step();
    }

    // =========================================================================
    // NAVIGATION & INIT
    // =========================================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        renderCurrentMode();
      });
    });

    voiceToggleBtn.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      voiceToggleBtn.textContent = voiceEnabled ? '🔊 Voice On' : '🔇 Muted';
      if (!voiceEnabled && currentAudio) currentAudio.pause();
    });

    function renderCurrentMode() {
      if (currentMode === 'alphabet') renderAlphabetMode();
      else if (currentMode === 'soundmatch') { setupSoundMatchQuestion(); renderSoundMatchMode(); }
      else if (currentMode === 'smallwords') { initCvcWord(); renderSmallWordsMode(); }
      else if (currentMode === 'wordsearch') { initWordSearch(); renderWordSearchMode(); }
      else if (currentMode === 'lettermatch') { setupLetterMatch(); renderLetterMatchMode(); }
    }

    renderCurrentMode();
  </script>
</body>
</html>
